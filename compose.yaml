# Compose Spec (no `version:` key — obsolete since the schema merge).
#
# traefik terminates TLS on ${DOMAIN} and routes:
#   Host(${DOMAIN}) && PathPrefix(/api)  -> worker   (higher priority, checked first)
#   Host(${DOMAIN})                      -> ui       (catch-all)
#
# EDGE AUTHENTICATION. A human logs in once with HTTP BasicAuth at Traefik
# (users live in ./config/traefik/users.htpasswd, which YOU create — it is
# gitignored; see docs/DEPLOYMENT.md). Both routers require it. On the /api
# router Traefik then replaces the Authorization header with
# `Bearer ${TRAFFIC_AI_API_TOKEN}` before proxying, because the worker accepts
# only that bearer token and a browser <img> (the MJPEG stream) cannot send
# one. The browser therefore authenticates with BasicAuth alone and never sees
# the token.
#
# BasicAuth has no lockout of its own, so each router also carries a Traefik
# `ratelimit` middleware that runs BEFORE it: password guessing is answered
# 429 instead of being tried at wire speed. See the notes on the worker router.
#
# Startup order: postgres healthy -> migrate (one-shot `alembic upgrade head`)
# -> worker (also needs redis healthy) -> ui.
#
# redis, postgres and worker are never published to the host — only traefik
# binds ports 80/443. See docs/DEPLOYMENT.md for the operator runbook.
#
# `deploy.resources` figures are estimates sized for CPU-only inference over two
# streams, not measurements from a production host. Tune them with
# `docker stats` (docs/DEPLOYMENT.md, "Resource expectations").

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# `worker` and `migrate` run the same image: the migration tool and the
# revisions ship inside it (docker/Dockerfile.worker), so the schema and the
# code that expects it can never be built apart.
x-worker-image: &worker-image
  build:
    context: .
    dockerfile: docker/Dockerfile.worker
  image: traffic-ai-worker:local

# The one place the database URL is assembled, so migrate and worker cannot
# disagree about which database they mean. The password lands in a URL: use a
# hex value (`openssl rand -hex 24`), or percent-encode anything else.
x-database-url: &database-url "postgresql+asyncpg://${POSTGRES_USER:-traffic}:${POSTGRES_PASSWORD:-traffic}@postgres:5432/${POSTGRES_DB:-traffic_ai}"

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=false
      - --ping=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: still effectively root on the host (a container that can
      # talk to the Docker socket can launch other containers as root). This
      # is the accepted risk of the Docker provider — see docs/DEPLOYMENT.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      # BasicAuth users (htpasswd, bcrypt). A file rather than a label because
      # a bcrypt hash is full of `$`, which compose would try to interpolate.
      # Long syntax with create_host_path: false so a MISSING file stops
      # `docker compose up` with a clear error. The short syntax would have
      # Docker silently create an empty directory at that path, and Traefik
      # would then fail to read users from it.
      - type: bind
        source: ./config/traefik/users.htpasswd
        target: /etc/traefik/users.htpasswd
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # Above --maxmemory 256mb: that cap covers the dataset, not Redis's
          # own overhead, so the container limit needs headroom over it.
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      # The default is the DEVELOPMENT password on purpose. The worker's
      # production gate (traffic_ai.config.Settings) refuses to start while the
      # database URL still contains it, so forgetting to set a real password in
      # .env stops the deployment instead of shipping a guessable one.
      #
      # Postgres reads this once, when it first initialises the data volume.
      # Changing it later does NOT change the role's password — see
      # docs/DEPLOYMENT.md, "Troubleshooting".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ so compose leaves the variables for the container's shell to expand.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging
    # Not directly reachable — no `ports:`. Only migrate and worker connect to
    # it, over the compose-internal network.

  migrate:
    <<: *worker-image
    # One-shot: runs to completion and stays exited. Failure is visible —
    # `docker compose ps -a` shows a non-zero exit and the worker never starts
    # against a schema that was not brought up to date.
    restart: "no"
    # The image's ENTRYPOINT is the API server (`python -m traffic_ai.api`), so
    # `command:` alone would be appended to it. Replace the entrypoint.
    # alembic.ini and migrations/ sit in the image's WORKDIR (/app).
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same environment as the worker, so the same production gate applies: a
      # missing token or a development-password URL fails HERE, before the
      # worker. alembic reads only the database URL; the token is required by
      # the settings validation, not used.
      TRAFFIC_AI_ENVIRONMENT: production
      TRAFFIC_AI_LOG_LEVEL: ${TRAFFIC_AI_LOG_LEVEL:-INFO}
      TRAFFIC_AI_LOG_FORMAT: ${TRAFFIC_AI_LOG_FORMAT:-json}
      TRAFFIC_AI_DATABASE_URL: *database-url
      TRAFFIC_AI_API_TOKEN: ${TRAFFIC_AI_API_TOKEN:-}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

  worker:
    <<: *worker-image
    restart: unless-stopped
    # Docker's default is 10s, then SIGKILL. The worker's shutdown (api/app.py
    # lifespan) waits up to 10s for the pipelines to stop and then up to 10s for
    # the history writer to drain its buffer to Postgres, and uvicorn first
    # drains open requests (the app caps that at 5s): 25s worst case. 30s covers
    # it, so a `docker compose stop` or a redeploy does not cut the final
    # history flush short.
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Not merely "started": the schema must be current before the writer's
      # first flush, and a failed migration must leave the worker down.
      migrate:
        condition: service_completed_successfully
    environment:
      TRAFFIC_AI_ENVIRONMENT: production
      TRAFFIC_AI_LOG_LEVEL: ${TRAFFIC_AI_LOG_LEVEL:-INFO}
      TRAFFIC_AI_LOG_FORMAT: ${TRAFFIC_AI_LOG_FORMAT:-json}
      TRAFFIC_AI_REDIS_URL: redis://redis:6379/0
      TRAFFIC_AI_DATABASE_URL: *database-url
      # Blank when unset. Settings treats a blank token as no token, so with
      # TRAFFIC_AI_ENVIRONMENT=production the worker refuses to start rather
      # than accept an empty bearer. There is deliberately no default value.
      TRAFFIC_AI_API_TOKEN: ${TRAFFIC_AI_API_TOKEN:-}
      # On by default. Off keeps the live dashboard and drops history; the
      # migrate service still runs, since the schema is cheap to keep current.
      TRAFFIC_AI_PERSISTENCE_ENABLED: ${TRAFFIC_AI_PERSISTENCE_ENABLED:-true}
      # The worker's own per-client limiter (the edge limiter in the labels below
      # is a separate, earlier layer). Defaults are Settings' own, repeated here
      # so they are visible and tunable from .env.
      TRAFFIC_AI_RATE_LIMIT_ENABLED: ${TRAFFIC_AI_RATE_LIMIT_ENABLED:-true}
      TRAFFIC_AI_RATE_LIMIT_REQUESTS: ${TRAFFIC_AI_RATE_LIMIT_REQUESTS:-120}
      TRAFFIC_AI_RATE_LIMIT_STREAM_REQUESTS: ${TRAFFIC_AI_RATE_LIMIT_STREAM_REQUESTS:-10}
      # How many reverse proxies sit between the client and the worker, so the
      # limiter keys on the real client address instead of the proxy's. 1 is
      # Traefik alone, as shipped here. Put another proxy or a load balancer in
      # front of Traefik and this must grow with it, or every client shares the
      # proxy's bucket (see docs/DEPLOYMENT.md, "Rate limits and proxy hops").
      TRAFFIC_AI_TRUSTED_PROXY_HOPS: ${TRAFFIC_AI_TRUSTED_PROXY_HOPS:-1}
      TRAFFIC_AI_VIDEO_DIR: /data/videos
      TRAFFIC_AI_MODEL_WEIGHTS: ${TRAFFIC_AI_MODEL_WEIGHTS:-/app/weights/yolov8n.pt}
      TRAFFIC_AI_DEVICE: ${TRAFFIC_AI_DEVICE:-cpu}
      TRAFFIC_AI_TARGET_FPS: ${TRAFFIC_AI_TARGET_FPS:-12}
      TRAFFIC_AI_DETECT_EVERY_N_FRAMES: ${TRAFFIC_AI_DETECT_EVERY_N_FRAMES:-2}
      TRAFFIC_AI_FRAME_WIDTH: ${TRAFFIC_AI_FRAME_WIDTH:-960}
    volumes:
      # Read-only: the worker only ever reads demo footage, never writes it.
      - ./data/videos:/data/videos:ro
      # Named volume so a container restart does not re-download YOLO weights.
      - model-weights:/app/weights
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # CPU inference is the dominant cost and this limit directly caps how
          # many frames per second the pipelines process: measured locally,
          # two torchvision streams saturate whatever they are given (2.0 cpus
          # -> ~0.5 processed fps per camera). Give the worker every core the
          # host can spare. Docker refuses a value above the host's core count,
          # hence the conservative default.
          cpus: "${TRAFFIC_AI_WORKER_CPUS:-2.0}"
          memory: 3G
        reservations:
          cpus: "1.0"
          memory: 1G
    labels:
      - traefik.enable=true
      - traefik.http.routers.worker.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.worker.entrypoints=websecure
      - traefik.http.routers.worker.tls.certresolver=le
      # Explicit and higher than the ui router's — PathPrefix(/api) must win
      # over the catch-all Host() rule regardless of rule-length ordering.
      - traefik.http.routers.worker.priority=100
      # ORDER MATTERS: Traefik runs these left to right. worker-ratelimit
      # first, so a flood of login attempts is refused (429) before BasicAuth
      # spends a bcrypt check on each one; worker-basicauth second, so nothing
      # reaches the token step without a valid login; api-bearer last, so the
      # Authorization header the browser sent (Basic ...) is replaced by the
      # service token only for a request that has already passed. Reversed,
      # the login check would run against a header the token step had already
      # overwritten, and a limiter after BasicAuth would never see the
      # failed guesses it exists to slow down.
      - traefik.http.routers.worker.middlewares=worker-ratelimit@docker,worker-basicauth@docker,api-bearer@docker
      - traefik.http.services.worker.loadbalancer.server.port=8000
      # --- middleware definitions -----------------------------------------
      # Each router owns its BasicAuth middleware, defined in its own
      # container's labels, instead of sharing one. A middleware definition
      # exists only while its container does; with a shared one, stopping the
      # worker would take the UI's login with it and the UI would 404 instead
      # of showing its "stale" banner. (A router that names a middleware
      # Traefik cannot find is not served at all, so this fails closed, never
      # open — but closed is still an outage.)
      - traefik.http.middlewares.worker-basicauth.basicauth.usersfile=/etc/traefik/users.htpasswd
      - traefik.http.middlewares.worker-basicauth.basicauth.realm=Traffic AI
      # Do not forward the browser's Basic credentials to the upstream.
      - traefik.http.middlewares.worker-basicauth.basicauth.removeheader=true
      # Edge rate limit, per source address: 20 requests/second sustained, with
      # a burst allowance of 40. BasicAuth has no lockout, so this is what
      # makes online password guessing slow; it also caps a single noisy client.
      # The figures are estimates, not measurements: raise `burst` if legitimate
      # users see 429s. Over the limit, Traefik answers 429 and the request
      # never reaches BasicAuth or the worker.
      - traefik.http.middlewares.worker-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.worker-ratelimit.ratelimit.burst=40
      # The bucket key is the TCP peer address (depth 0 = ignore
      # X-Forwarded-For), which is the real client because Traefik is the edge
      # here. Behind a load balancer that is WRONG — every client would share the
      # balancer's bucket — so set depth to the number of trusted proxies
      # in front of Traefik (and see docs/DEPLOYMENT.md, "Rate limits and proxy
      # hops"). A depth that does not match the real number of proxies keys
      # the bucket on the wrong address.
      - traefik.http.middlewares.worker-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=0
      # Sets the bearer the worker's AuthMiddleware expects. The token is
      # interpolated from the environment, never written in this file. It does
      # become part of the container's labels, readable by anyone who can run
      # `docker inspect` — the same people who can already read the container's
      # environment, and who are root-equivalent on this host anyway.
      - traefik.http.middlewares.api-bearer.headers.customrequestheaders.Authorization=Bearer ${TRAFFIC_AI_API_TOKEN:-}
    logging: *default-logging
    # Not directly reachable — no `ports:`. Traefik proxies to it over the
    # compose-internal network only.

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    restart: unless-stopped
    # Streamlit has no history to flush; this only has to outlast open
    # WebSocket sessions closing. Docker's 10s default is close, 15s is margin.
    stop_grace_period: 15s
    depends_on:
      worker:
        condition: service_healthy
    environment:
      TRAFFIC_AI_ENVIRONMENT: production
      TRAFFIC_AI_LOG_LEVEL: ${TRAFFIC_AI_LOG_LEVEL:-INFO}
      TRAFFIC_AI_LOG_FORMAT: ${TRAFFIC_AI_LOG_FORMAT:-json}
      TRAFFIC_AI_REDIS_URL: redis://redis:6379/0
      # The UI calls the worker server-to-server, bypassing Traefik, so it
      # presents the token itself. Same value, same blank-means-unset rule as
      # the worker's. (Settings applies the production gate to this process
      # too: without a token it refuses to start.)
      TRAFFIC_AI_API_TOKEN: ${TRAFFIC_AI_API_TOKEN:-}
      # The UI never connects to the database — it reads history over HTTP — so
      # it is given no database credentials. Turning persistence off here is
      # what stops the production gate asking for a database URL it does not
      # use. Without this, Settings would refuse to start the UI on the
      # development-password default.
      TRAFFIC_AI_PERSISTENCE_ENABLED: "false"
      # Server-to-server default (traffic_ai.config.Settings.api_internal_url)
      # already resolves to this; set explicitly so it survives a settings
      # default change without editing compose.yaml.
      TRAFFIC_AI_API_INTERNAL_URL: http://worker:8000
      # Browser-facing: relative, so it rides the same Host/TLS as the UI —
      # one DNS record, one certificate, no CORS. The browser's MJPEG <img>
      # sends the BasicAuth credentials it cached for this host; Traefik swaps
      # them for the bearer token (see the worker router).
      TRAFFIC_AI_API_PUBLIC_URL: /api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - traefik.enable=true
      - traefik.http.routers.ui.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.ui.entrypoints=websecure
      - traefik.http.routers.ui.tls.certresolver=le
      - traefik.http.routers.ui.priority=1
      # Headers first, so the 401 login challenge and a 429 carry them too (HSTS
      # on the very first response is the useful one); then the rate limit, so
      # guesses are throttled before BasicAuth checks them; then BasicAuth.
      - traefik.http.routers.ui.middlewares=ui-security-headers@docker,ui-ratelimit@docker,ui-basicauth@docker
      - traefik.http.services.ui.loadbalancer.server.port=8501
      # --- rate limit -------------------------------------------------------
      # Own bucket, defined here rather than shared with the worker router (the
      # same reason as the BasicAuth middleware below). Same figures and the same
      # depth caveat; see the notes on the worker router.
      - traefik.http.middlewares.ui-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.ui-ratelimit.ratelimit.burst=40
      - traefik.http.middlewares.ui-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=0
      # --- BasicAuth ------------------------------------------------------
      # Same users file as the worker router; defined here, not shared — see
      # the note on the worker's middleware definitions.
      - traefik.http.middlewares.ui-basicauth.basicauth.usersfile=/etc/traefik/users.htpasswd
      - traefik.http.middlewares.ui-basicauth.basicauth.realm=Traffic AI
      - traefik.http.middlewares.ui-basicauth.basicauth.removeheader=true
      # --- security headers -------------------------------------------------
      - traefik.http.middlewares.ui-security-headers.headers.stsseconds=31536000
      - traefik.http.middlewares.ui-security-headers.headers.stsincludesubdomains=true
      - traefik.http.middlewares.ui-security-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.ui-security-headers.headers.referrerpolicy=no-referrer
      # SAMEORIGIN, not DENY. Streamlit components (st_folium draws the map)
      # render in same-origin iframes; X-Frame-Options: DENY would block them.
      # SAMEORIGIN still stops any other site framing the dashboard, which is
      # the clickjacking protection that was wanted.
      - traefik.http.middlewares.ui-security-headers.headers.customframeoptionsvalue=SAMEORIGIN
      # No Content-Security-Policy on purpose. Streamlit ships inline scripts
      # and styles, so a strict policy breaks the app, and a loosened one
      # ('unsafe-inline') adds little. Do not add one here without testing the
      # dashboard in a browser.
    logging: *default-logging
    # Not directly reachable — no `ports:`. Traefik proxies to it (including
    # the /_stcore/stream WebSocket upgrade — see docs/DEPLOYMENT.md).

volumes:
  letsencrypt:
  model-weights:
  postgres-data:
