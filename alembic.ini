# Alembic configuration.
#
# There is deliberately no `sqlalchemy.url` here. `migrations/env.py` reads the URL
# from `Settings.database_url`, so the migration tool and the running service can
# never disagree about which database they mean — and no credential lives in a
# tracked file.

[alembic]
script_location = migrations
prepend_sys_path = src


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
