name: Release

# Builds and publishes both images (worker, ui) to GitHub Container Registry as
# multi-arch manifests, with an SBOM and provenance attestation on each, then
# scans what was pushed and reports to the Security tab.
#
# Nothing is published until CI passes. ci.yml runs on pushes to main and on
# pull requests, NOT on tags, so a `workflow_run` trigger would never fire for a
# tag; instead the `ci` job below calls ci.yml as a reusable workflow on the tag's
# own commit and `images` waits for it (`needs: ci`). A red CI means no image.
#
# Authentication is the workflow's own GITHUB_TOKEN. There is no registry
# credential in this file or in repository secrets.
#
# Every third-party action is pinned to a commit SHA, with the release it
# corresponds to in a comment. A tag is mutable (the action's owner, or whoever
# compromises them, can move it); a SHA is not. This job holds `packages: write`,
# so that matters here. Re-pin deliberately: look up the new tag's commit, do not
# edit the comment alone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The one job below widens exactly what it needs.
permissions:
  contents: read

# A second tag push must not cancel a release that is half-published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Keep in step with ARG UV_VERSION in docker/Dockerfile.* and ci.yml.
  UV_VERSION: "0.11.25"

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    # A called workflow can only be granted what its caller grants; CI needs
    # read access to the repository and nothing else.
    permissions:
      contents: read

  images:
    name: image (${{ matrix.image }})
    needs: ci
    runs-on: ubuntu-latest
    # arm64 is built under QEMU emulation, and the worker image carries torch;
    # allow for the slow path.
    timeout-minutes: 120

    permissions:
      contents: read          # checkout
      packages: write         # push to ghcr.io
      security-events: write  # upload the Trivy SARIF

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: worker
            dockerfile: docker/Dockerfile.worker
          - image: ui
            dockerfile: docker/Dockerfile.ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registry paths must be lowercase; the repository path need not be.
      - name: Compute image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a final v* tag (no `-` in it): 1.2.3, 1.2, `latest`, plus sha-<short>.
      # On a pre-release tag (v1.2.3-rc.1): only 1.2.3-rc.1 and sha-<short>, so a
      # release candidate can never become what `:latest` or `:1.2` pulls.
      # On a manual dispatch there is no semver tag, so only sha-<short> is
      # produced.
      #
      # `latest=false` turns off the action's own "auto" latest, and the `latest`
      # and `major.minor` tags are then enabled explicitly below. That keeps the
      # pre-release rule in this file, where it can be read and tested, instead of
      # depending on a heuristic inside the action.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
          # One cache scope per image so the worker's torch layers and the UI's
          # layers do not evict each other. mode=max also caches the builder
          # stage, which is where the dependency layer lives.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Attached to the pushed manifest as OCI attestations.
          sbom: true
          provenance: mode=max

      # Scans the exact digest just pushed (not a tag that could move). For a
      # multi-arch index Trivy selects the runner's platform, so this covers
      # linux/amd64; the arm64 image differs only in its platform wheels.
      # exit-code 0: this step reports to the Security tab and does not gate —
      # the image is already published by the time it runs.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Trivy results
        if: ${{ !cancelled() && hashFiles('trivy-results-*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
