[tool.poetry]
name = "traffic-ai"
version = "1.1.0"
description = "Toll-booth and traffic congestion monitoring — real-time vehicle detection, tracking, and counting over demo footage."
authors = ["bhuiyanmobasshir94"]
readme = "README.md"
license = "MIT"
packages = [{ include = "traffic_ai", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

# Shared by every service. Kept deliberately small so the UI image does not
# pull the inference stack (torch alone is ~800MB).
pydantic = "^2.13"
pydantic-settings = "^2.15"
structlog = "^26.1"
redis = "^8.1"
httpx = "^0.28"
orjson = "^3.11"

# --- extras ---------------------------------------------------------------
# Installed per-image: the UI container gets [ui], the worker gets [worker].
streamlit = { version = "^1.61", optional = true }
folium = { version = "^0.20", optional = true }
streamlit-folium = { version = "^0.27", optional = true }

fastapi = { version = "^0.141", optional = true }
uvicorn = { version = "^0.52", extras = ["standard"], optional = true }
# torchvision is the DEFAULT detector (BSD-3-Clause) — see Settings.detector.
# It must be installed from the same index as torch or its compiled ops fail at
# inference with "operator torchvision::nms does not exist"; docker/Dockerfile.worker
# installs both from the PyTorch CPU index in one command.
torchvision = { version = "^0.20", optional = true }
ultralytics = { version = "^8.4", optional = true }
# Pinned below 0.31: supervision schedules the removal of its ByteTrack export
# there. We import the canonical module path behind our own tracker interface
# (worker/tracking.py), so the swap is one file — but the pin keeps it a choice.
supervision = { version = ">=0.30,<0.31", optional = true }
# Held on the 4.x line deliberately. opencv 5.x is very new and neither
# ultralytics nor supervision has settled on it.
opencv-python-headless = { version = "^4.10", optional = true }
numpy = { version = "^2.1", optional = true }

# --- persistence ----------------------------------------------------------
# Postgres is the system of record for crossing history; Redis stays the hot
# live path (see docs/decisions/DECISIONS.md). The UI never connects to the
# database — it reads history over HTTP — so these stay out of the `ui` extra.
sqlalchemy = { version = "^2.0", extras = ["asyncio"], optional = true }
asyncpg = { version = "^0.30", optional = true }
alembic = { version = "^1.14", optional = true }

# --- observability --------------------------------------------------------
prometheus-client = { version = ">=0.21,<1.0", optional = true }

# --- test tooling ---------------------------------------------------------
# Declared as optional main dependencies rather than a Poetry dev group so the
# `test` extra below is installable with plain pip. CI and the Makefile both
# resolve with pip, and a Poetry group is invisible to them.
pytest = { version = "^9.1", optional = true }
pytest-asyncio = { version = "^1.4", optional = true }
ruff = { version = "^0.16", optional = true }
fakeredis = { version = "^2.37", optional = true }
pyyaml = { version = "^6.0", optional = true }
aiosqlite = { version = "^0.21", optional = true }

[tool.poetry.extras]
ui = ["streamlit", "folium", "streamlit-folium"]
worker = [
    "fastapi",
    "uvicorn",
    "torchvision",
    "ultralytics",
    "supervision",
    "opencv-python-headless",
    "numpy",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "prometheus-client",
]
# Everything the suite needs to COLLECT and pass, and nothing more. This is
# deliberately `worker` minus torch/ultralytics/uvicorn: the suite is designed
# to run with no inference stack (tests/conftest.py), but it does import
# fastapi, numpy, supervision and cv2 at module scope, so those are required.
# Installing only `[ui]` leaves six test modules uncollectable.
test = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "fakeredis",
    "pyyaml",
    "aiosqlite",
    "fastapi",
    "numpy",
    "supervision",
    "opencv-python-headless",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "prometheus-client",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "S104",  # binding 0.0.0.0 is intentional inside a container
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test
"migrations/env.py" = ["E402"]  # alembic's generated import order

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "requires_inference: needs torch/ultralytics installed (skipped by default)",
    "requires_postgres: needs a live Postgres via TRAFFIC_AI_TEST_DATABASE_URL (skipped by default)",
]
