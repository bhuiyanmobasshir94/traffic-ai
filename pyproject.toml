[project]
name = "traffic-ai"
version = "1.1.0"
description = "Toll-booth and traffic congestion monitoring — real-time vehicle detection, tracking, and counting over demo footage."
authors = [{ name = "bhuiyanmobasshir94" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<4.0"

# Shared by every service. Kept deliberately small so the UI image does not
# pull the inference stack (torch alone is ~800MB).
dependencies = [
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "structlog>=26.1,<27.0",
    "redis>=8.1,<9.0",
    "httpx>=0.28,<0.29",
    "orjson>=3.11,<4.0",
]

# --- extras -----------------------------------------------------------------
# Installed per-image: the UI container gets [ui], the worker gets [worker].
[project.optional-dependencies]
ui = [
    "streamlit>=1.61,<2.0",
    "folium>=0.20,<0.21",
    "streamlit-folium>=0.27,<0.28",
]
worker = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    # torch is declared explicitly (it previously only arrived transitively via
    # ultralytics/torchvision, so nothing pinned where it came from). It must
    # be installed from the SAME index as torchvision or its compiled ops fail
    # at inference with "operator torchvision::nms does not exist" — the
    # container still starts and passes its healthcheck, so this only surfaces
    # once a detection actually needs NMS. [tool.uv.sources] below pins both
    # torch and torchvision to the dedicated PyTorch CPU index so the pairing
    # can never drift again; docker/Dockerfile.worker installs both from that
    # index in one command for non-uv (pip) installs too.
    "torch",
    # torchvision is the DEFAULT detector (BSD-3-Clause) — see Settings.detector.
    "torchvision>=0.20,<0.21",
    # ultralytics (YOLOv8) is AGPL-3.0; this repository is MIT. Detection sits
    # behind the Detector protocol (src/traffic_ai/worker/detection.py) so
    # selecting "ultralytics" as the detector is a fully supported, explicit
    # opt-in rather than the default — see docs/decisions/DECISIONS.md.
    "ultralytics>=8.4,<9.0",
    # Pinned below 0.31: supervision schedules the removal of its ByteTrack export
    # there. We import the canonical module path behind our own tracker interface
    # (worker/tracking.py), so the swap is one file — but the pin keeps it a choice.
    "supervision>=0.30,<0.31",
    # Held on the 4.x line deliberately. opencv 5.x is very new and neither
    # ultralytics nor supervision has settled on it.
    "opencv-python-headless>=4.10,<5.0",
    "numpy>=2.1,<3.0",
    # --- persistence ----------------------------------------------------------
    # Postgres is the system of record for crossing history; Redis stays the hot
    # live path (see docs/decisions/DECISIONS.md). The UI never connects to the
    # database — it reads history over HTTP — so these stay out of the `ui` extra.
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    # --- observability --------------------------------------------------------
    "prometheus-client>=0.21,<1.0",
]
# Everything the suite needs to COLLECT and pass, and nothing more. This is
# deliberately `worker` minus torch/ultralytics/uvicorn: the suite is designed
# to run with no inference stack (tests/conftest.py), but it does import
# fastapi, numpy, supervision and cv2 at module scope, so those are required.
# Installing only `[ui]` leaves six test modules uncollectable.
#
# `test` is not self-sufficient the other way round either: tests/ui/ imports
# streamlit and folium, which live in `ui`. Run the full suite with both:
# `uv sync --extra ui --extra test` or `pip install -e ".[ui,test]"`.
#
# Declared as optional dependencies rather than a uv dev-dependency group so
# this extra is installable with plain pip: `pip install -e ".[test]"` must
# keep working for anyone without uv, and CI and the Makefile both resolve
# this way too.
test = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff>=0.16,<0.17",
    "fakeredis>=2.37,<3.0",
    "pyyaml>=6.0,<7.0",
    "aiosqlite>=0.21,<0.22",
    "fastapi>=0.141,<0.142",
    "numpy>=2.1,<3.0",
    "supervision>=0.30,<0.31",
    "opencv-python-headless>=4.10,<5.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "prometheus-client>=0.21,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_ai"]

# --------------------------------------------------------------------------
# uv — reproducible resolution
# --------------------------------------------------------------------------
# Pins torch and torchvision to the PyTorch CPU wheel index so the pairing
# documented above (same index, same command) is encoded in uv.lock itself and
# cannot silently drift to a CUDA build or a mismatched pair on a future
# `uv lock`. `explicit = true` keeps this index out of resolution for every
# other dependency — only packages named in [tool.uv.sources] use it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# --------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "S104",  # binding 0.0.0.0 is intentional inside a container
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test
"migrations/env.py" = ["E402"]  # alembic's generated import order

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "requires_inference: needs torch/ultralytics installed (skipped by default)",
    "requires_postgres: needs a live Postgres via TRAFFIC_AI_TEST_DATABASE_URL (skipped by default)",
]
