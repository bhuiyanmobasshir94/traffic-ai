{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "traffic-ai.serviceAccountName" . }}
  labels:
    {{- include "traffic-ai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither workload talks to the Kubernetes API, so no token is projected.
automountServiceAccountToken: false
{{- end }}
