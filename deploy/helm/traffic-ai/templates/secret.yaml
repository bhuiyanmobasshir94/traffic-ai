{{- /*
Lesser path, non-production convenience only. Rendered ONLY when no
`auth.existingSecret` is named. Values files are routinely committed and
shared, so anything passed through `auth.apiToken` / `auth.databaseUrl` should
be treated as already leaked — prefer `auth.existingSecret`, which keeps the
values out of values files, `helm template`, and `helm get values` entirely.

A key is emitted only when its value is non-empty. An absent key makes the
worker start without that variable, and src/traffic_ai/config.py then refuses
to run in production with a named reason — it never starts open by accident.
*/ -}}
{{- if and (not .Values.auth.existingSecret) (or .Values.auth.apiToken .Values.auth.databaseUrl) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "traffic-ai.fullname" . }}
  labels:
    {{- include "traffic-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.auth.apiToken }}
  api-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.databaseUrl }}
  database-url: {{ . | quote }}
  {{- end }}
{{- end }}
