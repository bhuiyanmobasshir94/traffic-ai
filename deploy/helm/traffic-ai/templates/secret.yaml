{{- /*
Lesser path, non-production convenience only. Rendered ONLY when no
`auth.existingSecret` is named. Values files are routinely committed and
shared, so anything passed through `auth.apiToken` / `auth.databaseUrl` should
be treated as already leaked — prefer `auth.existingSecret`, which keeps the
values out of values files, `helm template`, and `helm get values` entirely.

A key is emitted only when its value is non-empty. An absent key makes the
worker start without that variable, and src/traffic_ai/config.py then refuses
to run in production with a named reason — it never starts open by accident.

HOOK, WHEN MIGRATIONS ARE ON. The migrate Job (job-migrate.yaml) is a
pre-install hook, and Helm creates a release's ordinary objects only AFTER its
pre-install hooks finish. A Secret rendered the ordinary way would therefore not
exist when the Job starts, and the first install would fail. So while
`migrations.enabled`, this Secret is itself a pre-install/pre-upgrade hook with a
lower weight than the Job (-10 vs 0): it is created first. The cost, stated
plainly: Helm does not track hook objects as part of the release, so
`helm uninstall` leaves this Secret (credentials included) behind, and it is
deleted and recreated on every upgrade. `auth.existingSecret` has neither
problem, which is one more reason it is the preferred path. With migrations off
it is an ordinary object again.
*/ -}}
{{- if and (not .Values.auth.existingSecret) (or .Values.auth.apiToken .Values.auth.databaseUrl) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "traffic-ai.fullname" . }}
  labels:
    {{- include "traffic-ai.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
type: Opaque
stringData:
  {{- with .Values.auth.apiToken }}
  api-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.databaseUrl }}
  database-url: {{ . | quote }}
  {{- end }}
{{- end }}
