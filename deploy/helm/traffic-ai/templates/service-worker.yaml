apiVersion: v1
kind: Service
metadata:
  name: {{ include "traffic-ai.worker.fullname" . }}
  labels:
    {{- include "traffic-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: {{ .Values.worker.service.type }}
  ports:
    - name: http
      port: {{ .Values.worker.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "traffic-ai.worker.selectorLabels" . | nindent 4 }}
