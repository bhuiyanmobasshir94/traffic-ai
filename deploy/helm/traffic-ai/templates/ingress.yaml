{{- if .Values.ingress.enabled }}
{{- /*
Annotations are the user's own, plus whatever edge authentication adds. Built
here rather than in values so a controller-specific annotation can never be
forgotten (or half-set) when edgeAuth.enabled is true.

Everything below fails closed: asking for edge auth and not supplying what the
controller needs to enforce it is a render error, never an Ingress that looks
protected and is not. Credentials never appear here, only the NAME of the
Secret (ingress-nginx) or the names of Middleware CRs (Traefik) that hold them.
*/ -}}
{{- $edge := .Values.ingress.edgeAuth }}
{{- $traefik := eq (default "" .Values.ingress.className) "traefik" }}
{{- $annotations := deepCopy (default (dict) .Values.ingress.annotations) }}
{{- if $edge.enabled }}
  {{- if not .Values.ingress.tls.enabled }}
    {{- fail "ingress.edgeAuth.enabled requires ingress.tls.enabled: BasicAuth credentials would cross the network in clear text over HTTP" }}
  {{- end }}
  {{- if $traefik }}
    {{- if not .Values.ingress.traefik.middlewares }}
      {{- fail "ingress.traefik.middlewares is required when ingress.edgeAuth.enabled is true and ingress.className is traefik (create the Middleware CRs, then list them as <namespace>-<name>@kubernetescrd)" }}
    {{- end }}
  {{- else }}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/auth-type" "basic" }}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/auth-secret" (required "ingress.edgeAuth.secretName is required when ingress.edgeAuth.enabled is true" $edge.secretName) }}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/auth-realm" $edge.realm }}
    {{- /* BasicAuth has no lockout, so cap the guessing rate per client address.
    A limit-rps the operator already set under ingress.annotations wins. The value
    must be a string: an annotation cannot hold a number. */}}
    {{- if and $edge.limitRps (not (hasKey $annotations "nginx.ingress.kubernetes.io/limit-rps")) }}
      {{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-rps" (toString (int $edge.limitRps)) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if and $traefik .Values.ingress.traefik.middlewares }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (join "," .Values.ingress.traefik.middlewares) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "traffic-ai.fullname" . }}
  labels:
    {{- include "traffic-ai.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled is true" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          # /api MUST stay first. Both entries are `Prefix`, and they overlap
          # (every /api/... request also matches /). Controllers disagree on
          # how they break that tie: some pick the longest (most specific)
          # matching path regardless of declaration order, others honor the
          # order the paths are written in. Declaring /api before / is
          # correct under both, and is the equivalent of compose.yaml giving
          # the worker's Traefik router priority 100 over the UI's 1.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "traffic-ai.worker.fullname" . }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "traffic-ai.ui.fullname" . }}
                port:
                  name: http
{{- end }}
