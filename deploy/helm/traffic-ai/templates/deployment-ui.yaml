apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traffic-ai.ui.fullname" . }}
  labels:
    {{- include "traffic-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "traffic-ai.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.auth.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "traffic-ai.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "traffic-ai.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "traffic-ai.uiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "traffic-ai.ui.fullname" . }}
          env:
            # The UI calls the worker server-to-server (bypassing the ingress),
            # so it presents the API token itself, from the same Secret as the
            # worker (compose.yaml does the same). It never connects to the
            # database and is given no database URL. Required references with
            # `auth.existingSecret`; optional with the generated Secret, so an
            # unset value reaches Settings, which refuses to start in
            # production and says why.
            - name: TRAFFIC_AI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "traffic-ai.secretName" . }}
                  key: {{ include "traffic-ai.secretTokenKey" . }}
                  optional: {{ not .Values.auth.existingSecret }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ui.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.ui.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ui.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ui.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.ui.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.ui.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ui.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ui.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is true; /tmp is the only writable path.
            # HOME points here too (see configmap.yaml), so anything Streamlit
            # writes under $HOME lands on this emptyDir. /app/.streamlit is
            # deliberately NOT mounted over: that would hide the baked-in
            # config.toml.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
