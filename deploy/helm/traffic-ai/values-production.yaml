# Production overlay. Layer it over the defaults:
#
#   helm upgrade --install traffic-ai deploy/helm/traffic-ai \
#     -n traffic-ai --create-namespace \
#     -f deploy/helm/traffic-ai/values-production.yaml \
#     --set ingress.host=traffic.example.org
#
# Nothing secret lives in this file. The API token and the database URL come
# from a Secret you create out-of-band and name below — without it the worker
# refuses to start (src/traffic_ai/config.py, `_production_requires_hardening`:
# a production config needs TRAFFIC_AI_API_TOKEN and a database URL that does
# not carry the development password). Create it first:
#
#   kubectl -n traffic-ai create secret generic traffic-ai-secrets \
#     --from-literal=api-token="$(openssl rand -hex 32)" \
#     --from-literal=database-url="postgresql+asyncpg://USER:PASS@HOST:5432/traffic_ai"

image:
  # Your registry, e.g. "registry.example.com/traffic-ai". Tags are pinned to
  # an exact release, never :latest.
  registry: ""
  pullPolicy: IfNotPresent
  worker:
    repository: traffic-ai-worker
    tag: "1.1.0"
  ui:
    repository: traffic-ai-ui
    tag: "1.1.0"

# External Redis, by URL (managed service or an in-cluster release). The
# value below is a placeholder shape, not a working address — point it at
# yours. If the URL embeds a password, override TRAFFIC_AI_REDIS_URL through
# worker.extraEnv / ui.extraEnv with a secretKeyRef instead of writing it here.
redis:
  url: "redis://redis-master.redis.svc.cluster.local:6379/0"

auth:
  # Referenced by NAME only. The values stay in the cluster.
  existingSecret: traffic-ai-secrets
  existingSecretTokenKey: api-token
  existingSecretDatabaseUrlKey: database-url
  allowUnauthenticated: false

ingress:
  enabled: true
  # Traefik, because it is the only controller where the whole edge login works:
  # BasicAuth at the edge, then the API bearer injected toward the worker, so the
  # browser's direct /api requests (the live MJPEG video) are authenticated.
  # ingress-nginx cannot inject the token (it forwards the browser's Basic
  # header, which the worker rejects with 401), so under nginx the dashboard is
  # gated but the video does not play. nginx stays a supported choice with that
  # limit: see "Using ingress-nginx instead" below and docs/KUBERNETES.md,
  # "Edge authentication".
  className: traefik
  # Deliberately empty: the chart refuses to render without a real host, so a
  # forgotten --set ingress.host fails loudly instead of deploying a
  # placeholder name.
  host: ""
  tls:
    enabled: true
    # Pre-created kubernetes.io/tls Secret, or one your certificate manager
    # populates. This chart does not install cert-manager or its CRDs.
    secretName: traffic-ai-tls
  edgeAuth:
    enabled: true
    # ingress-nginx only (see below); Traefik takes its users from the Middleware.
    secretName: traffic-ai-basic-auth
  # The Middleware CRs below are NOT created by this chart: you create them in
  # the release namespace first, with exactly these names (the format is
  # <namespace>-<name>@kubernetescrd, and the namespace here is `traffic-ai`).
  # YAML for all three, and the Secret each needs, is in docs/KUBERNETES.md,
  # "Edge authentication". ORDER MATTERS, as in compose.yaml:
  #   1. ratelimit : throttle login guesses before they are checked
  #   2. basicauth : the human login
  #   3. api-bearer: replace the browser's Basic header with the API token, so
  #                  the video request reaches the worker authenticated
  # A name that does not exist as a Middleware is expected to make Traefik
  # reject the route rather than serve the app unprotected (UNVERIFIED: no live
  # Traefik was available). Create all three before installing.
  traefik:
    middlewares:
      - traffic-ai-ratelimit@kubernetescrd
      - traffic-ai-basicauth@kubernetescrd
      - traffic-ai-api-bearer@kubernetescrd
  # No controller-specific annotations are set for Traefik. UNVERIFIED: that
  # Traefik's default entrypoint timeouts leave the Streamlit WebSocket and the
  # long-lived MJPEG streams alone was not checked against a live controller; if
  # either is cut off, tune `respondingTimeouts` on Traefik's entrypoint (its
  # own configuration, not this chart's).
  annotations: {}
  #
  # --- Using ingress-nginx instead ---------------------------------------
  # Replace the `className`, `edgeAuth` and `annotations` choices above, with
  # `--set ingress.className=nginx` plus these annotations, and create the
  # BasicAuth Secret first (htpasswd lines under the key `auth`):
  #
  #   kubectl -n traffic-ai create secret generic traffic-ai-basic-auth \
  #     --from-file=auth=<(htpasswd -nbB -C 12 admin '<password>')
  #
  #   annotations:
  #     nginx.ingress.kubernetes.io/ssl-redirect: "true"
  #     # Streamlit holds a WebSocket (/_stcore/stream) open and the worker serves
  #     # long-lived MJPEG streams; the controller's 60s default timeouts would
  #     # cut both. Buffering off so frames reach the browser as produced.
  #     nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #     nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  #     nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #
  # and point `networkPolicy` at ingress-nginx's namespace and pods (below).
  # KNOWN LIMIT: the dashboard is gated, but the browser's direct /api requests
  # get 401, so the video does not play, until you take one of the options in
  # docs/KUBERNETES.md, "Edge authentication".

worker:
  # One replica, always. Each worker replica runs every camera pipeline and
  # writes its own copy of every crossing, so a second replica duplicates
  # history and overwrites the live counters: it is not scale-out and not safe
  # redundancy. (The chart also never autoscales the worker.)
  replicaCount: 1

ui:
  replicaCount: 2

# Voluntary disruptions (node drains) may take one pod of each Deployment at
# a time. maxUnavailable, not minAvailable: with worker.replicaCount 1 a
# minAvailable of 1 would make the worker unevictable and block drains.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Default-deny ingress to the worker. These selectors are TRAEFIK's, matching
# `ingress.className: traefik` above: the policy admits only the UI pods and the
# pods these selectors match, so a Traefik that runs elsewhere or is labelled
# differently is locked out of /api. Check both against your install
# (`kubectl get pods -A -l app.kubernetes.io/name=traefik`), and that your CNI
# enforces NetworkPolicy. For ingress-nginx use `ingress-nginx` in both.
networkPolicy:
  enabled: true
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: traefik
  ingressControllerPodSelector:
    app.kubernetes.io/name: traefik
